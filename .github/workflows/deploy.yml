name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '10 18 * * *'

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
        PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
        PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        SUPABASE_STORAGE_BUCKET: img

    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build archive field
        if: github.event_name != 'schedule'
        run: npm run build
      - name: Build archive field (sleep rebuild)
        if: github.event_name == 'schedule'
        run: npm run build
        env:
          ARCHIVE_REBUILD_MODE: sleep
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Functions in ./functions are bundled into the deployment automatically.
          # The prebuild step rewrites public/archive-manifest.json, so the tree is
          # dirty at deploy time; --commit-dirty suppresses the wrangler warning.
          command: pages deploy dist --project-name=ydnil-poh --branch=main --commit-dirty=true
